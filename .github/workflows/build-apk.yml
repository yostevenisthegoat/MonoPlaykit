name: Build & Release Public APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v java >/dev/null 2>&1; then
            echo "::error::Java executable could not be detected on PATH."
            exit 1
          fi
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          java -version
          JAVA_VER_LINE="$(java -version 2>&1 | head -n 1)"
          RAW_VER="$(echo "$JAVA_VER_LINE" | sed -n 's/.*version "\([^"]*\)".*/\1/p')"
          if [ -z "$RAW_VER" ]; then
            echo "::error::Unable to parse active Java version from: $JAVA_VER_LINE"
            exit 1
          fi
          MAJOR_VER="$(echo "$RAW_VER" | cut -d'.' -f1)"
          if [ "$MAJOR_VER" = "1" ]; then
            MAJOR_VER="$(echo "$RAW_VER" | cut -d'.' -f2)"
          fi
          if ! [[ "$MAJOR_VER" =~ ^[0-9]+$ ]]; then
            echo "::error::Detected non-numeric Java major version: $MAJOR_VER"
            exit 1
          fi
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java $MAJOR_VER."
            exit 1
          fi
          echo "Verified active Java major version: $MAJOR_VER"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYTOOL_BIN="keytool"
          if [ -n "${JAVA_HOME:-}" ] && [ -x "${JAVA_HOME}/bin/keytool" ]; then
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Generating temporary ./debug.keystore..."
            "$KEYTOOL_BIN" -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "Using existing ./debug.keystore"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create ./debug.keystore"
            exit 1
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Extract App Metadata and Rename APK
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          # Extract versionName from app/build.gradle.kts or gradle/libs.versions.toml
          RAW_VERSION=""
          if [ -f "app/build.gradle.kts" ]; then
            RAW_VERSION="$(grep -E '^\s*versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*=\s*"([^"]+)".*/\1/' || true)"
          fi
          if [ -z "$RAW_VERSION" ] && [ -f "gradle/libs.versions.toml" ]; then
            RAW_VERSION="$(grep -E '^\s*(appVersion|versionName)\s*=' gradle/libs.versions.toml | head -n 1 | sed -E 's/.*=\s*"([^"]+)".*/\1/' || true)"
          fi
          APP_VERSION="${RAW_VERSION:-1.0}"

          # Extract app name from app/build.gradle.kts, gradle/libs.versions.toml, strings.xml, or settings.gradle.kts
          RAW_NAME=""
          if [ -f "app/build.gradle.kts" ]; then
            RAW_NAME="$(grep -E '^\s*(val\s+appName\s*=|resValue\("string",\s*"app_name",)' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || true)"
          fi
          if [ -z "$RAW_NAME" ] && [ -f "gradle/libs.versions.toml" ]; then
            RAW_NAME="$(grep -E '^\s*appName\s*=' gradle/libs.versions.toml | head -n 1 | sed -E 's/.*=\s*"([^"]+)".*/\1/' || true)"
          fi
          if [ -z "$RAW_NAME" ] && [ -f "app/src/main/res/values/strings.xml" ]; then
            RAW_NAME="$(sed -n 's/.*<string name="app_name">\([^<]*\)<\/string>.*/\1/p' app/src/main/res/values/strings.xml | head -n 1 || true)"
          fi
          if [ -z "$RAW_NAME" ] && [ -f "settings.gradle.kts" ]; then
            RAW_NAME="$(grep -E '^\s*rootProject\.name\s*=' settings.gradle.kts | head -n 1 | sed -E 's/.*=\s*"([^"]+)".*/\1/' || true)"
          fi
          if [ -z "$RAW_NAME" ]; then
            RAW_NAME="$(basename "${GITHUB_REPOSITORY:-AndroidApp}")"
          fi

          # Sanitize app name for safe artifact & release APK filenames (e.g., "Mono PlayKit" -> "MonoPlayKit")
          APP_NAME="$(echo "$RAW_NAME" | sed -E 's/[^A-Za-z0-9._-]+//g')"
          if [ -z "$APP_NAME" ]; then
            APP_NAME="AndroidApp"
          fi

          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "::error::Expected APK not found at $APK_SOURCE"
            exit 1
          fi

          APK_FILE_NAME="${APP_NAME}-v${APP_VERSION}.apk"
          APK_TARGET="app/build/outputs/apk/debug/${APK_FILE_NAME}"
          mv "$APK_SOURCE" "$APK_TARGET"

          echo "APP_NAME=${APP_NAME}" >> "$GITHUB_ENV"
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
          echo "APK_FILE_NAME=${APK_FILE_NAME}" >> "$GITHUB_ENV"

          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk_file_name=${APK_FILE_NAME}" >> "$GITHUB_OUTPUT"

          echo "Extracted Metadata -> APP_NAME=${APP_NAME}, APP_VERSION=${APP_VERSION}, APK_FILE_NAME=${APK_FILE_NAME}"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-v${{ env.APP_VERSION }}
          path: app/build/outputs/apk/debug/${{ env.APK_FILE_NAME }}
          if-no-files-found: error

      - name: Prepare APK release asset and changelog
        id: prepare_release
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TMP_DIR="$(mktemp -d)"
          SOURCE_APK="app/build/outputs/apk/debug/${APK_FILE_NAME}"
          ASSET_PATH="${RELEASE_TMP_DIR}/${APK_FILE_NAME}"
          cp "$SOURCE_APK" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ]; then
            echo "::error::Failed to copy APK release asset to $ASSET_PATH"
            exit 1
          fi

          PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG="$(git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"- %s" -n 15 || true)"
          else
            CHANGELOG="$(git log --no-merges --pretty=format:"- %s" -n 10 || true)"
          fi

          if [ -z "$CHANGELOG" ]; then
            LATEST_MSG="$(git log -1 --pretty=format:"- %s" 2>/dev/null || echo "- Automated open-source build")"
            CHANGELOG="$LATEST_MSG"
          fi

          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          {
            echo "changelog<<__CHANGELOG_EOF__"
            echo "$CHANGELOG"
            echo "__CHANGELOG_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Publish APK to Public GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGELOG_BODY: ${{ steps.prepare_release.outputs.changelog }}
        shell: bash
        run: |
          set -euo pipefail

          TAG_NAME="v${APP_VERSION}-build-${GITHUB_RUN_NUMBER}"
          RELEASE_TITLE="${APP_NAME} v${APP_VERSION} (Build #${GITHUB_RUN_NUMBER})"

          NOTES_FILE="$(mktemp)"
          {
            echo "## 📢 What's New"
            echo "$CHANGELOG_BODY"
            echo ""
            echo "---"
            echo ""
            echo "🌐 **Open Source Build:** Built publicly by GitHub Actions."
            echo "- **Application:** ${APP_NAME}"
            echo "- **Version:** v${APP_VERSION}"
            echo "- **Build Run:** #${GITHUB_RUN_NUMBER}"
            echo "- **Commit SHA:** ${GITHUB_SHA}"
          } > "$NOTES_FILE"

          gh release create "$TAG_NAME" \
            "${{ steps.prepare_release.outputs.asset_path }}" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --target "${GITHUB_SHA}" \
            --latest
